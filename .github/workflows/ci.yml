name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새 푸시가 오면 진행 중인 검증을 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · build · scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: erp-portal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # cache: npm 은 쓰지 않는다. erp-portal/package-lock.json 이
          # .gitignore 대상이라 캐시 키로 쓸 lockfile 이 저장소에 없다.

      # lockfile 이 없어 npm ci 를 쓸 수 없다. 재현 가능한 빌드를 원하면
      # .gitignore 에서 package-lock.json 을 제외하고 npm ci 로 바꾼다.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # CLAUDE.md Canonical Commands 와 동일한 진입점을 쓴다.
      # tsx 는 devDependency 이므로 npx 가 로컬 바이너리를 해석한다.
      - name: Unit — store persistence
        run: npx tsx scripts/store-persistence-scenario.ts

      - name: E2E — 통합 시나리오
        run: npx tsx scripts/e2e-scenario.ts

      - name: E2E — 5대 대표 시나리오
        run: npx tsx scripts/run-5-scenarios.ts
